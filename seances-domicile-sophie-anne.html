/* ============ RENDU ============ */
let audioCtx=null;
function beep(f,d){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);
  o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.001,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.3,audioCtx.currentTime+.02);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);
  o.start();o.stop(audioCtx.currentTime+d);}catch(e){}}

function startChrono(btn,sec){
  if(btn.dataset.running){return;}
  btn.dataset.running="1";btn.classList.add('run');
  let t=sec;const span=btn.querySelector('.count');
  span.textContent=t+'s';
  const id=setInterval(()=>{
    t--;
    if(t<=3&&t>0)beep(880,.1);
    if(t<=0){clearInterval(id);beep(1320,.25);span.textContent='✔';
      btn.classList.remove('run');delete btn.dataset.running;
      setTimeout(()=>{span.textContent=sec+'s';},1500);return;}
    span.textContent=t+'s';
  },1000);
}

function render(data){
  let html=`<header style="--accent:${data.color}">
    <h1>${data.title}</h1><div class="meta">${data.meta}</div></header>
    <div class="intro">${data.intro}</div>`;
  data.items.forEach(it=>{
    if(it.phase){
      html+=`<div class="phase"><h2>${it.phase}</h2><div class="ln"></div><span class="t">${it.note||''}</span></div>`;
    }else{
      const side=it.side?`<span class="side">${it.side}</span>`:'';
      html+=`<div class="card">
        <div class="fig">${FIG[it.fig]||''}</div>
        <div class="body">
          <p class="nm">${it.nm}${side}</p>
          <p class="cue">${it.cue}</p>
          <button class="badge" onclick="startChrono(this,${it.sec})">⏱ <span class="count">${it.sec}s</span></button>
        </div></div>`;
    }
  });
  html+=`<div class="end">Fin de séance — pense à noter ses sensations 📝</div>`;
  return html;
}

function show(who){
  const data = who==='sophie'?SOPHIE:ANNE;
  document.documentElement.style.setProperty('--accent', data.color);
  document.getElementById('content').innerHTML = render(data);
  document.getElementById('tabS').classList.toggle('active',who==='sophie');
  document.getElementById('tabA').classList.toggle('active',who==='anne');
  window.scrollTo(0,0);
}
show('sophie');
</script>
</body>
</html>
