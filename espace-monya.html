const b2a=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function unlock(){
  const pw=document.getElementById('pw').value, err=document.getElementById('err');
  err.textContent='';
  try{
    const enc=new TextEncoder();
    const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(DATA.salt),iterations:DATA.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(DATA.iv)},key,b2a(DATA.ct));
    const html=new TextDecoder().decode(pt);
    const f=document.createElement('iframe');
    f.setAttribute('style','position:fixed;inset:0;width:100%;height:100%;border:0');
    document.body.innerHTML=''; document.body.style.background='#fbf7f8';
    document.body.appendChild(f); f.srcdoc=html;
  }catch(e){ err.textContent='❌ Mot de passe incorrect. Réessaie.'; }
}
