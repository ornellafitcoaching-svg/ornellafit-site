const KEY='ofc_espace-monya_code';
const b2a=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function tryCode(pw){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(DATA.salt),iterations:DATA.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(DATA.iv)},key,b2a(DATA.ct)));
}
async function unlock(saved){
  const err=document.getElementById('err'); err.textContent='';
  const pw=(saved||document.getElementById('pw').value).trim().toLowerCase();
  try{ const html=await tryCode(pw); try{localStorage.setItem(KEY,pw);}catch(e){} document.open(); document.write(html); document.close(); }
  catch(e){ if(saved){ try{localStorage.removeItem(KEY);}catch(x){} } else err.textContent='Code incorrect. Réessaie, ou écris à Ornella.'; }
}
document.getElementById('go').onclick=()=>unlock();
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
try{ const s=localStorage.getItem(KEY); if(s) unlock(s); }catch(e){}
</script></body></html>
