  var b64=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
  var $=function(i){return document.getElementById(i)};
  function ouvrir(code){
    return crypto.subtle.importKey("raw",new TextEncoder().encode(String(code).trim().toUpperCase()),"PBKDF2",false,["deriveKey"])
      .then(function(k){return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(D.s),iterations:D.n,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"])})

      .then(function(buf){
        try{localStorage.setItem(KEY,String(code).trim().toUpperCase())}catch(e){}
        var html=new TextDecoder().decode(buf);
        document.open();document.write(html);document.close();
        return true;
      });
  }
  function formulaire(texte){
    $("msg").textContent=texte; $("f").hidden=false;
